name: Auto-update Cursor

on:
  schedule:
    # Daily at 9:00 AM MSK (6:00 AM UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Check for Cursor updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for updates
        id: update
        run: |
          set +e
          ./scripts/update-version.sh
          UPDATE_EXIT_CODE=$?
          set -e

          if [ $UPDATE_EXIT_CODE -eq 0 ]; then
            if git diff --quiet package.nix; then
              echo "has_updates=false" >> $GITHUB_OUTPUT
              echo "No updates available"
            else
              echo "has_updates=true" >> $GITHUB_OUTPUT
              NEW_VERSION=$(grep -oP 'version = "\K[^"]+' package.nix | head -1)
              echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
              echo "Updates available: version $NEW_VERSION"
            fi
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "Update script failed with exit code $UPDATE_EXIT_CODE"
            exit 1
          fi

      - name: Test build
        if: steps.update.outputs.has_updates == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          nix build .#cursor --print-build-logs --impure
          nix flake check --impure

      - name: Commit and push
        if: steps.update.outputs.has_updates == 'true'
        run: |
          git add package.nix
          git diff --quiet --cached && { echo "No changes to commit"; exit 0; }
          git commit -m "chore: update cursor to ${{ steps.update.outputs.new_version }}"
          git push
